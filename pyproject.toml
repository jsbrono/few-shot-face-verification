[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faceverify"
version = "1.0.0"
description = "Few-shot face verification with Siamese networks: metric learning vs a learned verification head."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jakub Bronowicki" }]
license = { text = "MIT" }
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy",
    "pillow",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
